[workspace]
resolver = "2"
members = [
    "core/acelus-auth",
    "core/acelus-cas",
    "core/acelus-content",
    "core/acelus-diag",
    "core/acelus-instance",
    "core/acelus-launch",
    "core/acelus-meta",
    "core/acelus-native-sys",
    "core/acelus-net",
    "core/acelus-rpc",
    "core/acelusd",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/jaysyrk/Acelus"
authors = ["jaysyrk <jacobmmmmmm107@gmail.com>"]

[workspace.dependencies]
acelus-auth = { path = "core/acelus-auth" }
acelus-cas = { path = "core/acelus-cas" }
acelus-content = { path = "core/acelus-content" }
acelus-diag = { path = "core/acelus-diag" }
acelus-instance = { path = "core/acelus-instance" }
acelus-launch = { path = "core/acelus-launch" }
acelus-meta = { path = "core/acelus-meta" }
acelus-native-sys = { path = "core/acelus-native-sys" }
acelus-net = { path = "core/acelus-net" }
acelus-rpc = { path = "core/acelus-rpc" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
dirs = "6"
futures = "0.3"
hex = "0.4"
jsonwebtoken = "9"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reflink-copy = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2", "gzip"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

wiremock = "0.6"
rsa = "0.9"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
